name: News update + Live site deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"   # প্রতি ৩ ঘণ্টায় খবর হালনাগাদ
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect news from all sources
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # ঐচ্ছিক: থাকলে AI সারাংশ ও MCQ তৈরি হবে
        run: |
          node scripts/fetch-news.mjs
          node scripts/insight.mjs || echo "insight step failed (non-fatal)"

      - name: Save data to repository
        run: |
          git config user.name "tis-bot"
          git config user.email "tis-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No new news"; exit 0; fi
          git commit -m "news: $(TZ=Asia/Dhaka date '+%Y-%m-%d %H:%M') update [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done

      - name: Publish live site (gh-pages branch)
        run: |
          rm -rf /tmp/site && mkdir /tmp/site
          rsync -a --exclude .git --exclude .github --exclude scripts ./ /tmp/site/
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "tis-bot"
          git config user.email "tis-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy $(TZ=Asia/Dhaka date '+%Y-%m-%d %H:%M')"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
