<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="0.55" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7f9ef"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg)"/>
  <!-- rising sun = প্রতিদিন -->
  <circle cx="372" cy="138" r="54" fill="url(#sun)"/>
  <g stroke="#fde68a" stroke-width="10" stroke-linecap="round" opacity=".9">
    <path d="M372 58v-18M432 82l13-13M452 138h18M312 82l-13-13"/>
  </g>
  <!-- folded news page -->
  <path d="M98 168h236c14 0 26 12 26 26v190c0 22-18 40-40 40H122c-22 0-40-18-40-40V184c0-9 7-16 16-16z" fill="url(#page)"/>
  <path d="M360 224h34c10 0 18 8 18 18v142c0 22-18 40-40 40h-12z" fill="#bbf7d0"/>
  <!-- TIS -->
  <text x="221" y="282" text-anchor="middle" font-family="Poppins, Arial Black, Arial, sans-serif" font-weight="900" font-size="104" fill="#065f46" letter-spacing="-2">TIS</text>
  <!-- headline lines -->
  <rect x="118" y="306" width="206" height="14" rx="7" fill="#10b981"/>
  <rect x="118" y="334" width="160" height="12" rx="6" fill="#94a3b8" opacity=".7"/>
  <rect x="118" y="360" width="186" height="12" rx="6" fill="#94a3b8" opacity=".7"/>
  <!-- growth bars on side page -->
  <rect x="372" y="350" width="10" height="34" rx="3" fill="#059669"/>
  <rect x="388" y="326" width="10" height="58" rx="3" fill="#059669"/>
  <path d="M368 318l20-22 16 10" stroke="#f59e0b" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- plus badge -->
  <circle cx="420" cy="420" r="52" fill="#f59e0b" stroke="#fff" stroke-width="10"/>
  <path d="M420 396v48M396 420h48" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
</svg>
